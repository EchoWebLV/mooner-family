[package]
name = "mooner-presale-litesvm"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone on purpose (MagicPad precedent): litesvm's solana v3 crates never unify
# with the program's solana-program 4 / rollups-sdk graph. The harness mirrors the
# program's offsets and tags in tests/common instead of importing the crate.
# Run: cargo build-sbf in ../ (and fixtures/fetch.sh once), then cargo test here.
[workspace]

[dependencies]
litesvm = "0.13.1"
solana-account = "3.4.0"
solana-address = { version = "2.6", features = ["decode", "curve25519"] }
solana-instruction = "=3.2.0"
solana-keypair = "3.1"
solana-message = { version = "3.1", features = ["bincode"] }
solana-rent = "3.1"
solana-signature = "3.3"
solana-signer = "3.0"
# "3.1" not "3.2": litesvm enables solana-system-interface's `bincode` feature, and in
# v3.2.0 that needs solana-instruction ^3.4.0, clashing with litesvm's `=3.2.0` pin.
solana-system-interface = "3.1"
solana-transaction = "3.1"
solana-clock = "3"
borsh = "1.7"
serde_json = "1"
base64 = "0.22"
